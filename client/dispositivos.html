<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taller Informática - Dispositivos</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">🔧 Taller Informático - DAW</a>
        </div>
        <nav class="main-nav">
          <ul>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="dispositivos.html">Dispositivos</a></li>
            <li><a href="reparaciones.html" class="active">Reparaciones</a></li>
            <li>
              <a href="#" id="btnToggleForm" class="btn-nuevo-cliente"
                >➕ Nuevo Dispositivo</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="dispositivos-layout">
      <!-- BARRA DE BÚSQUEDA -->
      <section class="search-bar-container">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar dispositivo por marca, modelo o tipo..."
          />
        </div>
      </section>

      <!-- SECCIÓN PRINCIPAL (Formulario colapsable + Listado en tabla) -->
      <section class="content-grid single-column" id="mainGrid">
        <!-- Formulario colapsable -->
        <div class="form-card hidden" id="formContainer">
          <div class="form-header">
            <h2 id="formTitle">Registrar Nuevo Dispositivo</h2>
            <button type="button" id="btnCloseForm" class="btn-close">✖</button>
          </div>
          <form id="device-form">
            <label for="customer">Cliente Propietario:</label>
            <select
              name="customer"
              id="customer"
              required
              style="
                padding: 0.75rem 1rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 0.95rem;
                background-color: #faf8f5;
                color: #1f2937;
                width: 100%;
                box-sizing: border-box;
              "
            >
              <option value="">Seleccione un cliente...</option>
            </select>

            <label for="type">Tipo de Dispositivo:</label>
            <input
              type="text"
              name="type"
              id="type"
              placeholder="Ej. Portátil, Sobremesa, Móvil..."
              required
            />

            <label for="brand">Marca:</label>
            <input
              type="text"
              name="brand"
              id="brand"
              placeholder="Ej. HP, Lenovo, ASUS..."
              required
            />

            <label for="model">Modelo:</label>
            <input
              type="text"
              name="model"
              id="model"
              placeholder="Ej. Pavilion 15, ThinkPad..."
              required
            />

            <label for="serialNumber">Número de Serie:</label>
            <input
              type="text"
              name="serialNumber"
              id="serialNumber"
              placeholder="Ej. SN123456789"
              required
            />

            <label for="observations">Observaciones / Avería:</label>
            <textarea
              name="observations"
              id="observations"
              placeholder="Describe la avería o estado del equipo..."
            ></textarea>

            <button type="submit" class="submit-btn">
              Guardar Dispositivo
            </button>
          </form>
        </div>

        <!-- Listado de dispositivos en tabla -->
        <section class="table-card">
          <h2>Listado de Dispositivos</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Tipo</th>
                  <th>Marca</th>
                  <th>Modelo</th>
                  <th>Número de Serie</th>
                  <th>Observaciones</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-dispositivos-body">
                <!-- Generado dinámicamente -->
              </tbody>
            </table>
          </div>
          <div id="device-response-message" class="message-box"></div>
        </section>
      </section>

      <div id="server-status" class="server-status-badge">
        <span id="status-dot" class="status-dot checking"></span>
        <span id="status-text">Comprobando servidor ...</span>
      </div>

      <!-- Pie de página discreto -->
      <footer class="dashboard-footer">
        Taller Informático DAW &copy; 2026
      </footer>
    </main>

    <script src="./js/dispositivos.js" defer></script>
  </body>
</html>
