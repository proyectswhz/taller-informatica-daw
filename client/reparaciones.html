<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taller Informática - Reparaciones</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- HEADER SUPERIOR -->
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">🔧 Taller Informático - DAW</a>
        </div>
        <nav class="main-nav">
          <ul>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="dispositivos.html">Dispositivos</a></li>
            <li><a href="reparaciones.html" class="active">Reparaciones</a></li>
            <li>
              <a href="#" id="btnToggleForm" class="btn-nuevo-cliente"
                >➕ Nueva Orden</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="dispositivos-layout">
      <!-- BARRA DE BÚSQUEDA -->
      <section class="search-bar-container">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por estado, cliente o descripción..."
          />
        </div>
      </section>

      <!-- SECCIÓN PRINCIPAL (Formulario colapsable + Listado en tabla) -->
      <section class="content-grid single-column" id="mainGrid">
        <!-- Formulario colapsable para Crear/Editar Orden -->
        <div class="form-card hidden" id="formContainer">
          <div class="form-header">
            <h2 id="formTitle">Registrar Nueva Orden de Reparación</h2>
            <button type="button" id="btnCloseForm" class="btn-close">✖</button>
          </div>
          <form id="order-form">
            <label for="customer">Cliente:</label>
            <select
              name="customer"
              id="customer"
              required
              style="
                padding: 0.75rem 1rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 0.95rem;
                background-color: #faf8f5;
                color: #1f2937;
                width: 100%;
                box-sizing: border-box;
              "
            >
              <option value="">Seleccione un cliente...</option>
            </select>

            <label for="device">Dispositivo:</label>
            <select
              name="device"
              id="device"
              required
              style="
                padding: 0.75rem 1rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 0.95rem;
                background-color: #faf8f5;
                color: #1f2937;
                width: 100%;
                box-sizing: border-box;
              "
            >
              <option value="">Seleccione primero un cliente...</option>
            </select>

            <label for="issueDescription">Descripción de la Avería:</label>
            <textarea
              name="issueDescription"
              id="issueDescription"
              rows="3"
              placeholder="Describe el problema que presenta el equipo..."
              required
            ></textarea>

            <label for="status">Estado:</label>
            <select
              name="status"
              id="status"
              required
              style="
                padding: 0.75rem 1rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 0.95rem;
                background-color: #faf8f5;
                color: #1f2937;
                width: 100%;
                box-sizing: border-box;
              "
            >
              <option value="Pendiente">Pendiente</option>
              <option value="En reparación">En reparación</option>
              <option value="Finalizado">Finalizado</option>
              <option value="Entregada">Entregada</option>
            </select>

            <label for="estimatedCost">Coste Estimado (€):</label>
            <input
              type="number"
              step="0.01"
              name="estimatedCost"
              id="estimatedCost"
              placeholder="0.00"
            />

            <label for="finalCost">Coste Final (€):</label>
            <input
              type="number"
              step="0.01"
              name="finalCost"
              id="finalCost"
              placeholder="0.00"
            />

            <label for="technicianNotes">Notas del Técnico:</label>
            <textarea
              name="technicianNotes"
              id="technicianNotes"
              rows="2"
              placeholder="Observaciones internas del taller..."
            ></textarea>

            <button type="submit" class="submit-btn">
              Guardar Orden de Reparación
            </button>
          </form>
        </div>

        <!-- Listado de reparaciones en tabla -->
        <section class="table-card">
          <h2>Listado de Órdenes de Reparación</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Dispositivo</th>
                  <th>Cliente</th>
                  <th>Estado</th>
                  <th>Avería</th>
                  <th>Diagnóstico Técnico</th>
                  <th>Coste</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-reparaciones-body">
                <!-- Generado dinámicamente -->
              </tbody>
            </table>
          </div>
          <div id="order-response-message" class="message-box"></div>
        </section>
      </section>

      <!-- Indicador de estado del servidor -->
      <div id="server-status" class="server-status-badge">
        <span id="status-dot" class="status-dot checking"></span>
        <span id="status-text">Comprobando servidor ...</span>
      </div>

      <!-- Pie de página -->
      <footer class="dashboard-footer">
        Taller Informático DAW &copy; 2026
      </footer>
    </main>

    <script src="./js/reparacion.js" defer></script>
  </body>
</html>
