<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Taller - Panel Principal</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="dashboard-body">
    <!-- Cabecera de navegación unificada -->
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">🔧 Taller Informático - DAW</a>
        </div>
      </div>
    </header>

    <!-- Contenido Principal del Dashboard -->
    <main class="dashboard-container">
      <h1>Gestión de Taller Informático</h1>
      <p class="subtitle">Selecciona una opción para comenzar</p>

      <div class="button-group-horizontal">
        <!-- Botón 1: Buscar cliente existente -->
        <a href="clientes.html" class="dashboard-btn">
          <span>👤</span>
          Clientes
        </a>
        <a href="dispositivos.html" class="dashboard-btn">
          <span>💻</span>
          Dispositivos
        </a>
        <!-- Botón 3: Ver el listado general de reparaciones -->
        <a href="reparaciones.html" class="dashboard-btn">
          <span>📋</span>
          Reparaciones
        </a>
      </div>
    </main>

    <!-- Indicador de estado del servidor (Health Check) -->
    <div id="server-status" class="server-status-badge">
      <span id="status-dot" class="status-dot checking"></span>
      <span id="status-text">Comprobando servidor......</span>
    </div>

    <!-- Pie de página discreto -->
    <footer class="dashboard-footer">Taller Informático DAW &copy; 2026</footer>

    <!-- Script rápido para comprobar el estado de Render -->
    <script>
      async function checkServerStatus() {
        const dot = document.getElementById("status-dot");
        const text = document.getElementById("status-text");

        try {
          const response = await fetch(
            "https://taller-informatica-daw.onrender.com/api/health",
          );
          if (response.ok) {
            dot.className = "status-dot online";
            text.textContent = "Servidor Online";
          } else {
            throw new Error();
          }
        } catch (error) {
          dot.className = "status-dot offline";
          text.textContent = "Servidor Offline";
        }
      }

      checkServerStatus();
    </script>
  </body>
</html>
