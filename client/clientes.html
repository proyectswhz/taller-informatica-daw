<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Clientes - Taller DAW</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- HEADER SUPERIOR -->
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">🔧 TALLER DAW</a>
        </div>
        <nav class="main-nav">
          <ul>
            <li>
              <a href="#" id="btnToggleForm" class="btn-nuevo-cliente"
                >➕ Nuevo Cliente</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="clientes-layout">
      <!-- BARRA DE BÚSQUEDA -->
      <section class="search-bar-container">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar cliente por nombre, DNI o teléfono..."
          />
        </div>
      </section>

      <!-- SECCIÓN PRINCIPAL (Formulario colapsable + Listado en tabla) -->
      <div class="content-grid single-column" id="mainGrid">
        <!-- Columna Izquierda: Formulario (Oculto por defecto con clase hidden) -->
        <aside class="form-card hidden" id="formContainer">
          <div class="form-header">
            <h2>Registrar Nuevo Cliente</h2>
            <button type="button" id="btnCloseForm" class="btn-close">✖</button>
          </div>
          <form id="client-form">
            <label for="name">Nombre:</label>
            <input type="text" name="name" id="name" required />

            <label for="surname">Apellidos:</label>
            <input type="text" name="surname" id="surname" required />

            <label for="dni">DNI:</label>
            <input type="text" name="dni" id="dni" required />

            <label for="phone">Teléfono:</label>
            <input type="number" name="phone" id="phone" required />

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required />

            <label for="address">Dirección:</label>
            <input type="text" name="address" id="address" required />

            <button type="submit" class="submit-btn">Guardar Cliente</button>
          </form>
          <div id="response-message" class="message-box"></div>
        </aside>

        <!-- Columna Derecha: Listado en Tabla con los 3 botones -->
        <section class="table-card">
          <h2>Listado de Clientes</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Nombre y Apellidos</th>
                  <th>DNI</th>
                  <th>Teléfono</th>
                  <th>Email</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-clientes-body">
                <!-- Datos cargados dinámicamente desde JavaScript -->
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script src="./js/clientes.js" defer></script>
  </body>
</html>
