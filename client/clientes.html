<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Clientes - Taller DAW</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- HEADER SUPERIOR -->
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">🔧 Taller Informático - DAW</a>
        </div>
        <nav class="main-nav">
          <ul>
            <li>
              <a href="#" id="btnToggleForm" class="btn-nuevo-cliente"
                >➕ Nuevo Cliente</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="clientes-layout">
      <!-- BARRA DE BÚSQUEDA -->
      <section class="search-bar-container">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar cliente por nombre, DNI o teléfono..."
          />
        </div>
      </section>

      <!-- SECCIÓN PRINCIPAL (Formulario colapsable + Listado en tabla) -->
      <div class="content-grid single-column" id="mainGrid">
        <!-- Columna Izquierda: Formulario (Oculto por defecto con clase hidden) -->
        <aside class="form-card hidden" id="formContainer">
          <div class="form-header">
            <h2>Registrar Nuevo Cliente</h2>
            <button type="button" id="btnCloseForm" class="btn-close">✖</button>
          </div>
          <form id="client-form">
            <label for="name">Nombre:</label>
            <input type="text" name="name" id="name" required />

            <label for="surname">Apellidos:</label>
            <input type="text" name="surname" id="surname" required />

            <label for="dni">DNI:</label>
            <input type="text" name="dni" id="dni" required />

            <label for="phone">Teléfono:</label>
            <input type="number" name="phone" id="phone" required />

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required />

            <label for="address">Dirección:</label>
            <input type="text" name="address" id="address" required />

            <button type="submit" class="submit-btn">Guardar Cliente</button>
          </form>
          <div id="response-message" class="message-box"></div>
        </aside>

        <!-- Columna Derecha: Listado en Tabla con los 3 botones -->
        <section class="table-card">
          <h2>Listado de Clientes</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Nombre y Apellidos</th>
                  <th>DNI</th>
                  <th>Teléfono</th>
                  <th>Email</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-clientes-body">
                <!-- Datos cargados dinámicamente desde JavaScript -->
              </tbody>
            </table>
          </div>
        </section>
      </div>
      <!-- MODAL PARA AÑADIR DISPOSITIVO -->
      <div id="deviceModal" class="modal-overlay hidden">
        <div class="modal-card">
          <div class="form-header">
            <h2>Añadir Dispositivo al Cliente</h2>
            <button type="button" id="btnCloseDeviceModal" class="btn-close">
              ✖
            </button>
          </div>

          <form id="device-form">
            <input type="hidden" id="modalCustomerId" />

            <label for="deviceType">Tipo de Dispositivo:</label>
            <input
              type="text"
              id="deviceType"
              placeholder="Ej. Portátil, Sobremesa, Móvil..."
              required
            />

            <label for="deviceBrand">Marca:</label>
            <input
              type="text"
              id="deviceBrand"
              placeholder="Ej. HP, Lenovo, Apple..."
              required
            />

            <label for="deviceModel">Modelo:</label>
            <input
              type="text"
              id="deviceModel"
              placeholder="Ej. Pavilion 15, ThinkPad T480..."
              required
            />

            <label for="serialNumber">Número de Serie (Opcional):</label>
            <input
              type="text"
              id="serialNumber"
              placeholder="Ej. SN123456789"
            />

            <label for="deviceObservations">Observaciones / Avería:</label>
            <textarea
              id="deviceObservations"
              rows="3"
              placeholder="Describe el problema o estado del equipo..."
              required
              style="
                padding: 0.75rem 1rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 0.95rem;
                background-color: #faf8f5;
                color: #1f2937;
                resize: vertical;
                width: 100%;
                box-sizing: border-box;
              "
            ></textarea>

            <button
              type="submit"
              class="submit-btn"
              style="width: 100%; margin-top: 1.5rem"
            >
              Guardar Dispositivo
            </button>
          </form>
          <div id="device-response-message" class="message-box"></div>
        </div>
      </div>
      <div id="server-status" class="server-status-badge">
        <span id="status-dot" class="status-dot checking"></span>
        <span id="status-text">Comprobando servidor ...</span>
      </div>

      <!-- Pie de página discreto -->
      <footer class="dashboard-footer">
        Taller Informático DAW &copy; 2026
      </footer>
    </main>

    <script src="./js/clientes.js" defer></script>
  </body>
</html>
